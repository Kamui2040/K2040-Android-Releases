name: "Esca Agnellis: Rückmeldung (Deutsch)"
description: "Teile deine allgemeine Rückmeldung zu Esca Agnellis."
title: "[Esca][DE][Feedback] "
labels:
  - "app:esca-agnellis"
  - "language:de"
  - "feedback"
body:
  - type: markdown
    attributes:
      value: |
        Danke für deine Rückmeldung. Die aktuelle öffentliche Version ist Esca Agnellis 0.16.0.
        Bitte keine Sicherungen oder Exporte, Ernährungs- oder Gesundheitsdaten, Geräteseriennummern, Kontodaten, privaten Protokolle, lokalen Dateipfade, identifizierenden Informationen oder ungeschwärzten Screenshots anhängen.
  - type: input
    id: app_version
    attributes:
      label: App-Version
      placeholder: "0.16.0"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android-Version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Worauf bezieht sich deine Rückmeldung?
      options:
        - Tägliche Erfassung
        - Portionshilfe
        - Sicherung und Wiederherstellung
        - Design und Lesbarkeit
        - Sprache und Übersetzung
        - Installation oder Aktualisierung
        - Sonstiges
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: Was hat gut funktioniert?
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: Was war unklar oder schwierig?
  - type: textarea
    id: suggestion
    attributes:
      label: Was würdest du verbessern?
  - type: dropdown
    id: blocker
    attributes:
      label: Beeinträchtigt dies die normale Nutzung?
      options:
        - Nein
        - Teilweise
        - Ja
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutzprüfung
      options:
        - label: "Ich habe keine Sicherungen, Exporte, Ernährungs- oder Gesundheitsdaten, Geräteseriennummern, Kontodaten, lokalen Dateipfade oder identifizierenden Informationen angehängt."
          required: true
        - label: "Falls ich einen Screenshot oder ein Protokoll angehängt habe, habe ich persönliche oder sensible Informationen vollständig entfernt."
          required: true
