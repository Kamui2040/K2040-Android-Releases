name: "Esca Agnellis: Feedback (English)"
description: "Share general feedback about Esca Agnellis."
title: "[Esca][EN][Feedback] "
labels:
  - "app:esca-agnellis"
  - "language:en"
  - "feedback"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing feedback. The current public release is Esca Agnellis 0.16.0.
        Please do not attach backups or exports, nutrition or health data, device serial numbers, account details, private logs, local file paths, identifying information, or unredacted screenshots.
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: "0.16.0"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What is your feedback about?
      options:
        - Daily tracking
        - Portion guide
        - Backup and restore
        - Theme and readability
        - Language and translation
        - Installation or update
        - Other
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked well?
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: What was unclear or difficult?
  - type: textarea
    id: suggestion
    attributes:
      label: What would you improve?
  - type: dropdown
    id: blocker
    attributes:
      label: Does this affect normal use?
      options:
        - "No"
        - Partly
        - "Yes"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: "I have not attached backups, exports, nutrition or health data, device serial numbers, account details, local file paths, or identifying information."
          required: true
        - label: "If I attached a screenshot or log, I checked and fully removed personal or sensitive information."
          required: true
