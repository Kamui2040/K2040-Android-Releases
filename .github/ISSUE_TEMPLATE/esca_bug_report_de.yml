name: "Esca Agnellis: Fehlerbericht (Deutsch)"
description: "Melde ein Problem in Esca Agnellis, das sich wiederholen lässt."
title: "[Esca][DE][Fehler] "
labels:
  - "app:esca-agnellis"
  - "language:de"
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung. Die aktuelle öffentliche Version ist Esca Agnellis 0.16.0.
        Bitte keine Sicherungen oder Exporte, Ernährungs- oder Gesundheitsdaten, Geräteseriennummern, Kontodaten, Passwörter, privaten Protokolle, lokalen Dateipfade, identifizierenden Informationen oder ungeschwärzten Screenshots anhängen.
  - type: input
    id: app_version
    attributes:
      label: App-Version
      placeholder: "0.16.0"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android-Version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Gerät
      description: "Nur Hersteller und Modell; keine Seriennummer."
    validations:
      required: true
  - type: dropdown
    id: install_type
    attributes:
      label: Wie wurde die App installiert?
      options:
        - Neuinstallation
        - Von einer älteren Version aktualisiert
        - Unbekannt
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Was hast du getan, bevor das Problem auftrat?
      description: "Bitte nenne die Schritte in der richtigen Reihenfolge, damit sich das Problem wiederholen lässt."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Was sollte passieren?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Was ist stattdessen passiert?
    validations:
      required: true
  - type: dropdown
    id: repeats_after_restart
    attributes:
      label: Tritt das Problem nach dem Schließen und erneuten Öffnen der App wieder auf?
      options:
        - Ja
        - Nein
        - Nicht getestet
    validations:
      required: true
  - type: dropdown
    id: backup
    attributes:
      label: War eine Sicherung oder Wiederherstellung beteiligt?
      options:
        - Nein
        - Ja
        - Unbekannt
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutzprüfung
      options:
        - label: "Ich habe keine Sicherungen, Exporte, Ernährungs- oder Gesundheitsdaten, Geräteseriennummern, Kontodaten, lokalen Dateipfade oder identifizierenden Informationen angehängt."
          required: true
        - label: "Falls ich einen Screenshot oder ein Protokoll angehängt habe, habe ich persönliche oder sensible Informationen vollständig entfernt."
          required: true
