name: "Esca Agnellis: Bug Report (English)"
description: "Report a problem that can be repeated in Esca Agnellis."
title: "[Esca][EN][Bug] "
labels:
  - "app:esca-agnellis"
  - "language:en"
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. The current public release is Esca Agnellis 0.16.0.
        Do not attach backups or exports, nutrition or health data, device serial numbers, account details, passwords, private logs, local file paths, identifying information, or unredacted screenshots.
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: "0.16.0"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: "Manufacturer and model only; do not include a serial number."
    validations:
      required: true
  - type: dropdown
    id: install_type
    attributes:
      label: How was the app installed?
      options:
        - Fresh installation
        - Updated from an older version
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do before the problem happened?
      description: "Please list the steps in order so the problem can be repeated."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: repeats_after_restart
    attributes:
      label: Does it happen again after closing and reopening the app?
      options:
        - "Yes"
        - "No"
        - Not tested
    validations:
      required: true
  - type: dropdown
    id: backup
    attributes:
      label: Was a backup or restore involved?
      options:
        - "No"
        - "Yes"
        - Unknown
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: "I have not attached backups, exports, nutrition or health data, device serial numbers, account details, local file paths, or identifying information."
          required: true
        - label: "If I attached a screenshot or log, I checked and fully removed personal or sensitive information."
          required: true
